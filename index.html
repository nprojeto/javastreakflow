<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JavaStreak — Visão geral da plataforma</title>
<meta name="description" content="Manejo de javali, do campo ao relatório: documentação, planejamento da área, registro em campo e prestação de contas ao IBAMA — funcionando sem sinal.">
<meta name="theme-color" content="#16150F">
<meta property="og:type" content="website">
<meta property="og:title" content="JavaStreak — Visão geral da plataforma">
<meta property="og:description" content="Manejo de javali, do campo ao relatório. Documentação, mapa ao vivo, registro offline e fechamento para o IBAMA.">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<!-- Apresentação autossuficiente: sem fonte, script ou imagem de fora.
     Funciona em qualquer pasta e também sem internet, depois de aberta. -->
<style>
/*
  ⚠️ Página autossuficiente: nada de fonte, script ou imagem de fora. As marcas
  vão embutidas como data URI, porque a página publicada bloqueia qualquer
  recurso externo e uma imagem quebrada numa apresentação é pior que nenhuma.
*/
:root{
  --carvao:#16150F; --carvao2:#201E17; --carvao3:#2B2820;
  --osso:#EDE7D6; --osso2:#9A927F; --linha:#3A362B;
  --laranja:#E8552B; --laranja-cl:#FF7A1A;
  --verde:#5E8C4A; --verde-cl:#8FBF74; --alerta:#D9A441;
  --f: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--carvao); color:var(--osso); font-family:var(--f);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

/* ── palco ───────────────────────────────────────────────────────────────
   Cada slide ocupa a tela inteira. Só o ativo fica visível: os outros saem
   do fluxo para não roubar toque nem leitura de tela. */
#palco{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;padding:5vh 7vw 11vh;overflow:hidden;opacity:0;visibility:hidden;
  transform:translateY(26px) scale(.985);
  transition:opacity .5s ease,transform .5s cubic-bezier(.22,1,.36,1),visibility .5s;
}
.slide.on{opacity:1;visibility:visible;transform:none}
/* Ao voltar, o slide sai para o outro lado — o movimento conta a direção. */
.slide.saiu-tras{transform:translateY(-26px) scale(.985)}

/* Fundo vivo: duas manchas que respiram devagar, sem distrair. */
#palco::before,#palco::after{
  content:'';position:absolute;border-radius:50%;filter:blur(90px);
  pointer-events:none;z-index:0;
}
#palco::before{width:46vw;height:46vw;left:-12vw;top:-14vw;background:rgba(232,85,43,.16);animation:respira 15s ease-in-out infinite}
#palco::after{width:40vw;height:40vw;right:-10vw;bottom:-12vw;background:rgba(94,140,74,.14);animation:respira 19s ease-in-out infinite reverse}
@keyframes respira{0%,100%{transform:none}50%{transform:translate3d(3vw,2vh,0) scale(1.12)}}
.slide>*{position:relative;z-index:1}

/* ── entrada escalonada dos elementos ── */
.an{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1)}
.on .an{opacity:1;transform:none}
.on .an:nth-child(1){transition-delay:.06s}
.on .an:nth-child(2){transition-delay:.13s}
.on .an:nth-child(3){transition-delay:.2s}
.on .an:nth-child(4){transition-delay:.27s}
.on .an:nth-child(5){transition-delay:.34s}
.on .an:nth-child(6){transition-delay:.41s}
.on .an:nth-child(7){transition-delay:.48s}

/* ── tipografia ── */
.olho{
  font-size:clamp(11px,1.15vw,15px);letter-spacing:.22em;text-transform:uppercase;
  color:var(--laranja);font-weight:800;margin-bottom:1.6vh;display:flex;align-items:center;gap:.7em
}
.olho i{width:26px;height:2px;background:var(--laranja);display:inline-block;font-style:normal}
h1{font-size:clamp(34px,6.4vw,92px);line-height:1.02;letter-spacing:-.025em;font-weight:800}
h2{font-size:clamp(24px,3.6vw,52px);line-height:1.08;letter-spacing:-.02em;font-weight:800;margin-bottom:1.8vh}
.sub{font-size:clamp(14px,1.55vw,22px);color:var(--osso2);line-height:1.5;max-width:62ch}
.destaque{color:var(--laranja-cl)}
strong{color:var(--osso);font-weight:700}

/* ── grades de cartões ── */
.grade{display:grid;gap:clamp(9px,1.3vw,18px);margin-top:2.4vh}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(3,1fr)}
.card{
  background:linear-gradient(160deg,rgba(43,40,32,.92),rgba(32,30,23,.92));
  border:1px solid var(--linha);border-radius:16px;
  padding:clamp(11px,1.4vw,20px);
  transition:transform .3s ease,border-color .3s ease;
}
.card:hover{transform:translateY(-4px);border-color:var(--laranja)}
.card b{display:block;font-size:clamp(14px,1.45vw,20px);margin-bottom:.45em;line-height:1.2}
.card span{font-size:clamp(11.5px,1.12vw,15.5px);color:var(--osso2);line-height:1.45;display:block}
.ic{
  width:clamp(28px,2.6vw,38px);height:clamp(28px,2.6vw,38px);border-radius:10px;
  background:rgba(232,85,43,.14);color:var(--laranja-cl);
  display:flex;align-items:center;justify-content:center;margin-bottom:.75em;
  font-size:clamp(14px,1.35vw,19px);font-weight:800
}
.card.verde .ic{background:rgba(94,140,74,.18);color:var(--verde-cl)}
.card.futuro{border-style:dashed;border-color:var(--alerta)}
.card.futuro .ic{background:rgba(217,164,65,.16);color:var(--alerta)}

/* ── lista de traços ── */
.tracos{display:flex;flex-direction:column;gap:.9vh;margin-top:2vh}
/* ⚠️ O texto do item vai DENTRO de um bloco. Antes `b` e `span` eram itens de
   flex irmãos, e cada um quebrava por conta própria: o rótulo virava coluna e
   a frase ficava desalinhada. */
.tracos li{list-style:none;display:flex;gap:.8em;align-items:flex-start;font-size:clamp(13px,1.35vw,19px);line-height:1.45}
.tracos li>div{flex:1;min-width:0}
.tracos li::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--laranja);flex:none;margin-top:.55em}
.tracos li b{font-weight:700}
.tracos li span{color:var(--osso2)}

/* ── números grandes ── */
.numeros{display:flex;gap:clamp(18px,3.5vw,54px);margin-top:3vh;flex-wrap:wrap}
.num b{display:block;font-size:clamp(30px,4.6vw,64px);color:var(--laranja);line-height:1;letter-spacing:-.03em}
.num span{font-size:clamp(11px,1.1vw,14px);color:var(--osso2);text-transform:uppercase;letter-spacing:.11em}

/* ── capa ── */
.capa{align-items:center;text-align:center}
/* Marca deitada: manda a largura. */
.capa img{width:clamp(210px,30vw,430px);margin-bottom:2.4vh;filter:drop-shadow(0 12px 34px rgba(0,0,0,.6))}
.capa .sub{margin:2.2vh auto 0}
.pilulas{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;margin-top:4vh}
.pilulas span{
  border:1px solid var(--linha);border-radius:999px;padding:.55em 1.2em;
  font-size:clamp(11px,1.1vw,15px);color:var(--osso2);background:rgba(32,30,23,.6)
}

/* ── anel do índice ── */
.anel{
  width:clamp(84px,9vw,130px);height:clamp(84px,9vw,130px);border-radius:50%;
  border:4px solid var(--verde);display:flex;flex-direction:column;
  align-items:center;justify-content:center;flex:none;background:var(--carvao3)
}
.anel b{font-size:clamp(26px,3.4vw,46px);color:var(--verde-cl);line-height:1}
.anel span{font-size:clamp(9px,.85vw,12px);color:var(--osso2);margin-top:.3em}
.linhaIndice{display:flex;gap:clamp(14px,2.4vw,34px);align-items:center;margin-top:3vh}

/* ── fluxo horizontal ── */
.fluxo{display:flex;align-items:stretch;gap:0;margin-top:3.4vh;flex-wrap:wrap}
.passo{flex:1;min-width:150px;padding:0 clamp(8px,1.4vw,20px);border-left:1px solid var(--linha)}
.passo:first-child{border-left:0;padding-left:0}
.passo i{font-style:normal;font-size:clamp(22px,2.8vw,40px);font-weight:800;color:var(--laranja);display:block;line-height:1}
.passo b{display:block;font-size:clamp(13px,1.4vw,19px);margin:.5em 0 .35em}
.passo span{font-size:clamp(11px,1.05vw,14.5px);color:var(--osso2);line-height:1.45}

/* ── barra inferior ── */
#barra{
  position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(58,54,43,.6);z-index:20
}
#barra i{display:block;height:100%;background:var(--laranja);width:0;transition:width .45s cubic-bezier(.22,1,.36,1)}
#rodape{
  position:fixed;left:0;right:0;bottom:0;padding:1.6vh 7vw 2.2vh;
  display:flex;align-items:center;justify-content:space-between;z-index:19;
  pointer-events:none;font-size:clamp(10px,1vw,13px);color:var(--osso2)
}
#rodape img{height:clamp(20px,2.2vw,30px);opacity:.9}
#rodape .nav{display:flex;gap:.5em;pointer-events:auto}
#rodape button{
  background:rgba(32,30,23,.85);border:1px solid var(--linha);color:var(--osso);
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all .2s
}
#rodape button:hover{border-color:var(--laranja);color:var(--laranja-cl)}
#conta{letter-spacing:.14em;font-variant-numeric:tabular-nums}

/* ── ILUSTRAÇÕES ─────────────────────────────────────────────────────────
   ⚠️ A animação é CSS, não SMIL: `<animate>` foi descontinuado em parte dos
   navegadores e falha calado. E tudo parte de `.on`, para o desenho começar
   quando o slide entra — não enquanto ninguém está vendo. */
.duo{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(18px,3.2vw,52px);align-items:center;margin-top:1vh}
.duo .il{width:100%;height:auto;max-height:62vh;display:block}
.il{overflow:visible}

/* sobe e aparece */
.il-sobe{opacity:0;transform:translateY(14px)}
.on .il-sobe{animation:ilSobe .55s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.25s + var(--d,0s))}
@keyframes ilSobe{to{opacity:1;transform:none}}

/* cai de cima, como um pino no mapa */
.il-cai{opacity:0;transform:translateY(-16px) scale(.85);transform-box:fill-box;transform-origin:center bottom}
.on .il-cai{animation:ilCai .5s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(.3s + var(--d,0s))}
@keyframes ilCai{to{opacity:1;transform:none}}

/* traço que se desenha */
.il-traca{stroke-dashoffset:var(--len,300)}
.on .il-traca{animation:ilTraca 1.5s cubic-bezier(.4,0,.2,1) forwards;animation-delay:calc(.3s + var(--d,0s))}
@keyframes ilTraca{to{stroke-dashoffset:0}}

/* o mesmo traço, em repetição — para o percurso que continua gravando */
.il-traca-loop{stroke-dashoffset:var(--len,300)}
.on .il-traca-loop{animation:ilLoop 3.4s ease-in-out infinite}
@keyframes ilLoop{0%{stroke-dashoffset:var(--len)}55%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.35}}

/* risco de confirmação */
.il-risca{stroke-dasharray:22;stroke-dashoffset:22}
.on .il-risca{animation:ilTraca .4s ease forwards;animation-delay:calc(.3s + var(--d,0s))}

/* surge piscando uma vez */
.il-pisca{opacity:0}
.il-pisca{transform-box:fill-box;transform-origin:center}
.on .il-pisca{animation:ilPisca .6s ease forwards;animation-delay:calc(.35s + var(--d,0s))}
@keyframes ilPisca{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}

/* barra que enche
   ⚠️ `transform-box:fill-box` é obrigatório em SVG. Sem ele, `transform-origin`
   resolve contra o QUADRO inteiro e não contra o elemento: a barra encolhia em
   direção ao canto do desenho e reaparecia por cima do anel, longe do lugar. */
.il-barra{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.on .il-barra{animation:ilBarra .9s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.35s + var(--d,0s))}
@keyframes ilBarra{to{transform:scaleX(var(--w,1))}}

/* anel do índice */
.il-anel{stroke-dashoffset:var(--volta)}
.on .il-anel{animation:ilAnel 1.3s cubic-bezier(.22,1,.36,1) forwards;animation-delay:.35s}
@keyframes ilAnel{to{stroke-dashoffset:calc(var(--volta) - var(--parte))}}

/* coluna que cresce */
.il-cresce{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0)}
.on .il-cresce{animation:ilCresce .7s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.3s + var(--d,0s))}
@keyframes ilCresce{to{transform:none}}

/* halo do GPS, cone da bússola e ponto vermelho — contínuos */
.il-halo{transform-box:fill-box;transform-origin:center}
.on .il-halo{animation:ilHalo 2.4s ease-in-out infinite}
@keyframes ilHalo{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.35;transform:scale(1.22)}}
.il-gira{transform-origin:182px 190px}
.on .il-gira{animation:ilGira 7s ease-in-out infinite}
@keyframes ilGira{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(30deg)}}
.on .il-anda{animation:ilAnda 6s ease-in-out infinite}
@keyframes ilAnda{0%,100%{transform:none}50%{transform:translate(14px,-26px)}}
.on .il-pulsa{animation:ilPulsa 1.5s ease-in-out infinite}
@keyframes ilPulsa{0%,100%{opacity:1}50%{opacity:.25}}

/* a fila offline: sobe e some, como quem foi enviado */
.il-sobe-sai{opacity:0}
.on .il-sobe-sai{animation:ilFila 4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes ilFila{0%{opacity:0;transform:translateY(12px)}15%,55%{opacity:1;transform:none}75%{opacity:0;transform:translateY(-22px)}100%{opacity:0}}

/* ── celular estreito: as grades viram uma ou duas colunas ── */
@media (max-width:1000px){
  /* ⚠️ Em tela estreita a ilustração vai para cima do texto e encolhe: duas
     colunas de 400px cada não cabem, e espremer o desenho o torna ilegível. */
  .duo{grid-template-columns:1fr;gap:1.6vh}
  .duo .il{max-height:30vh;order:-1}
}
@media (max-width:820px){
  .g3,.g4,.g6{grid-template-columns:repeat(2,1fr)}
  .slide{padding:8vh 6vw 12vh}
  .linhaIndice{flex-direction:column;align-items:flex-start}
}
@media (max-width:520px){
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}
  .grade .card:nth-child(n+5){display:none}
}
@media (prefers-reduced-motion:reduce){
  .slide,.an{transition:none}
  /* Quem pediu menos movimento vê o desenho pronto, não o desenho parado no
     meio: tudo termina no estado final. */
  #palco::before,#palco::after,.on [class^="il-"]{animation:none!important}
  [class^="il-"]{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
  .il-barra{transform:scaleX(var(--w,1))!important}
}
</style>
</head>
<body>

<div id="palco"></div>

<div id="rodape">
  <img id="marca" alt="JavaStreak">
  <div class="nav">
    <button id="ant" aria-label="Anterior">‹</button>
    <span id="conta" style="align-self:center;padding:0 .5em"></span>
    <button id="pro" aria-label="Próximo">›</button>
    <button id="tela" aria-label="Tela cheia">⛶</button>
  </div>
</div>
<div id="barra"><i></i></div>

ont-size=\"10.5\" text-anchor=\"middle\" font-family=\"system-ui\">Histórico</text></g></svg></div></div>", "<div class=\"olho an\"><i></i>01 · Conformidade</div><h2 class=\"an\">Nada entra no campo irregular</h2><div class=\"duo an\"><div><ul class=\"tracos\"><li><div><b>CTF</b> <span>— conferido a cada ação, inclusive de quem é convidado.</span></div></li><li><div><b>Autorizações</b> <span>— acesso e IBAMA, com aviso antes de vencer.</span></div></li><li><div><b>Acervo</b> <span>— CRAF, CR e GT por arma, com o PDF anexado.</span></div></li><li><div><b>Veículos e pessoal</b> <span>— documentos da equipe no mesmo lugar.</span></div></li></ul></div><div><svg class=\"il\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"384\" height=\"284\" rx=\"14\" fill=\"#201E17\" stroke=\"#3A362B\"/><g class=\"il-sobe\" style=\"--d:0s\"><rect x=\"28\" y=\"40\" width=\"344\" height=\"44\" rx=\"10\" fill=\"#2B2820\" stroke=\"#3A362B\"/><rect x=\"42\" y=\"52\" width=\"20\" height=\"20\" rx=\"4\" fill=\"none\" stroke=\"#9A927F\" stroke-width=\"2\"/><path d=\"M46 62 l5 5 9-11\" fill=\"none\" stroke=\"#5E8C4A\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"il-risca\" style=\"--d:0.25s\"/><text x=\"76\" y=\"67\" fill=\"#EDE7D6\" font-size=\"15\" font-family=\"system-ui\">CTF</text><circle cx=\"352\" cy=\"62\" r=\"6\" fill=\"#5E8C4A\" class=\"il-pisca\" style=\"--d:0s\"/></g><g class=\"il-sobe\" style=\"--d:0.4s\"><rect x=\"28\" y=\"98\" width=\"344\" height=\"44\" rx=\"10\" fill=\"#2B2820\" stroke=\"#3A362B\"/><rect x=\"42\" y=\"110\" width=\"20\" height=\"20\" rx=\"4\" fill=\"none\" stroke=\"#9A927F\" stroke-width=\"2\"/><path d=\"M46 120 l5 5 9-11\" fill=\"none\" stroke=\"#5E8C4A\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"il-risca\" style=\"--d:0.65s\"/><text x=\"76\" y=\"125\" fill=\"#EDE7D6\" font-size=\"15\" font-family=\"system-ui\">Au ado e vira rota.</span></div></li><li><div><b>Em grupo</b> <span>— convite com CTF conferido dos dois lados.</span></div></li></ul></div><div><svg class=\"il\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"384\" height=\"284\" rx=\"14\" fill=\"#201E17\" stroke=\"#3A362B\"/><g class=\"il-sobe\" style=\"--d:0.0s\"><rect x=\"28\" y=\"30\" width=\"344\" height=\"72\" rx=\"14\" fill=\"#2B2820\" stroke=\"#E8552B\"/><circle cx=\"68\" cy=\"66\" r=\"20\" fill=\"#E8552B\" fill-opacity=\".18\"/><circle cx=\"68\" cy=\"66\" r=\"8\" fill=\"#E8552B\" class=\"il-halo\"/><text x=\"104\" y=\"72\" fill=\"#EDE7D6\" font-size=\"16\" font-family=\"system-ui\">Espera na ceva</text></g><g class=\"il-sobe\" style=\"--d:0.2s\"><rect x=\"28\" y=\"116\" width=\"344\" height=\"72\" rx=\"14\" fill=\"#2B2820\" stroke=\"#3A362B\"/><circle cx=\"68\" cy=\"152\" r=\"20\" fill=\"#3B6EA5\" fill-opacity=\".18\"/><path d=\"M54 162 q14 -24 28 -6 t14 -14\" fill=\"none\" stroke=\"#3B6EA5\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"70\" class=\"il-traca\" style=\"--len:70;--d:0.6000000000000001s\"/><text x=\"104\" y=\"158\" fill=\"#EDE7D6\" font-size=\"16\" font-family=\"system-ui\">Seguir rota</text></g><g class=\"il-sobe\" style=\"--d:0.4s\"><rect x=\"28\" y=\"202\" width=\"344\" height=\"72\" rx=\"14\" fill=\"#2B2820\" stroke=\"#3A362B\"/><circle cx=\"68\" cy=\"238\" r=\"20\" fill=\"#5E8C4A\" fill-opacity=\".18\"/><path d=\"M54 250 Q66 222 78 240 T92 226\" fill=\"none\" stroke=\"#5E8C4A\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"70\" class=\"il-traca-loop\" style=\"--len:70\"/><text x=\"104\" y=\"244\" fill=\"#EDE7D6\" font-size=\"16\" font-family=\"system-ui\">Caça livre</text></g></svg></div></div>", "<div class=\"olho an\"><i></i>04 · No campo</div><h2 class=\"an\">A tela vira um mapa ao vivo</h2><div class=\"duo an\"><div><ul class=\"tracos\"><li><div><b>O terreno</b> <span>— limite, rotas, cevas e avisos, em satélite.</span></div></li><li><div><b>Você</b> <span>— posição por GPS com raio de precisão.</span></div></li><li><div><b>A bússola</b> <span>— o cone mostra para onde você está virado.</span></div></li><li><div><b>Filtros e centralizar</b> <span>— mostre só o que interessa; volte em ~20 m.</span></div></li></ul></div><div><svg class=\"il\" viewBox=\"104 0 192 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect x=\"118\" y=\"10\" width=\"164\" height=\"280\" rx=\"20\" fill=\"#201E17\" stroke=\"#3A362B\" stroke-width=\"2\"/><rect x=\"140\" y=\"18\" width=\"120\" height=\"5\" rx=\"2.5\" fill=\"#3A362B\"/><clipPath id=\"tl\"><rect x=\"126\" y=\"22\" width=\"148\" height=\"256\" rx=\"12\"/></clipPath><g clip-path=\"url(#tl)\"><rect x=\"126\" y=\"22\" width=\"148\" height=\"256\" fill=\"#243018\"/><path d=\"M126 90 q40 -22 70 4 t78 -10\" stroke=\"#2F3D20\" stroke-width=\"16\" fill=\"none\"/><path d=\"M126 190 q50 18 80 -6 t68 12\" stroke=\"#2F3D20\" stroke-width=\"20\" fill=\"none\"/><path d=\"M140 70 L262 60 L266 240 L136 250 Z\" fill=\"#5E8C4A\" fill-opacity=\".12\" stroke=\"#5E8C4A\" stroke-width=\"2\"/><path d=\"M152 216 Q190 160 214 176 T252 96\" fill=\"none\" stroke=\"#3B6EA5\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"220\" class=\"il-traca\" style=\"--len:220;--d:.3s\"/><circle cx=\"238\" cy=\"132\" r=\"9\" fill=\"#E8552B\" stroke=\"#16150F\" stroke-width=\"2\"/><g class=\"il-anda\"><circle cx=\"182\" cy=\"190\" r=\"26\" fill=\"#E8552B\" fill-opacity=\".14\" class=\"il-halo\"/><path d=\"M182 190 L160 148 A46 46 0 0 1 204 148 Z\" fill=\"#E8552B\" fill-opacity=\".3\" class=\"il-gira\"/><circle cx=\"182\" cy=\"190\" r=\"7\" fill=\"#E8552B\" stroke=\"#fff\" stroke-width=\"2.5\"/></g></g></svg></div></div>", "<div class=\"olho an\"><i></i>05 · Registrar evento</div><h2 class=\"an\">O que aconteceu, onde aconteceu</h2><div class=\"duo an\"><div><p class=\"sub\">Um botão só. O tipo se escolhe depois — no mato ninguém sabe de antemão se vai ver um rastro ou um javali.</p><ul class=\"tracos\"><li><div><b>Onze tipos</b> <span>— avistamento, rastro, perigo, armadilha, água, isca, referência, foto.</span></div></li><li><div><b>Com foto</b> <span>— tirada pela câmera, no ponto exato.</span></div></li><li><div><b>Onde entra</b> <span>— o app pergunta quando há mais de uma ceva ou rota.</span></div></li></ul></div><div><svg class=\"il\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"384\" height=\"284\" rx=\"14\" fill=\"#243018\" stroke=\"#3A362B\"/><path d=\"M8 110 q70 -30 130 6 t120 -14 T392 118\" stroke=\"#2F3D20\" stroke-width=\"22\" fill=\"none\"/><path d=\"M8 220 q80 24 140 -8 t130 16\" stroke=\"#2F3D20\" stroke-width=\"26\" fill=\"none\"/><g class=\"il-cai\" style=\"--d:0.2s\"><path d=\"M78 126 l-9 -13 a11 11 0 1 1 18 0 Z\" fill=\"#E8552B\" stroke=\"#16150F\" stroke-width=\"1.6\"/><circle cx=\"78\" cy=\"110\" r=\"4\" fill=\"#16150F\"/><rect x=\"40\" y=\"132\" width=\"76\" height=\"19\" rx=\"9\" fill=\"#201E17\" stroke=\"#3A362B\"/><text x=\"78\" y=\"145\" fill=\"#EDE7D6\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"system-ui\">Avistamento</text></g><g class=\"il-cai\" style=\"--d:0.5s\"><path d=\"M188 94 l-9 -13 a11 11 0 1 1 18 0 Z\" fill=\"#9A927F\" stroke=\"#16150F\" stroke-width=\"1.6\"/><circle cx=\"188\" cy=\"78\" r=\"4\" fill=\"#16150F\"/><rect x=\"150\" y=\"100\" width=\"76\" height=\"19\" rx=\"9\" fill=\"#201E17\" stroke=\"#3A362B\"/><text x=\"188\" y=\"113\" fill=\"#EDE7D6\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"system-ui\">Rastro</text></g><g class=\"il-cai\" style=\"--d:0.8s\"><path d=\"M300 144 l-9 -13 a11 11 0 1 1 18 0 Z\" fill=\"#D9A441\" stroke=\"#16150F\" stroke-width=\"1.6\"/><circle cx=\"300\" cy=\"128\" r=\"4\" fill=\"#16150F\"/><rect x=\"262\" y=\"150\" width=\"76\" height=\"19\" rx=\"9\" fill=\"#201E17\" stroke=\"#3A362B\" \"num\"><b>30</b><span>dias de mapa offline</span></div></div><div class=\"grade g3 an\"><div class=\"card \"><div class=\"ic\">◍</div><b>Aplicativo instalável</b><span>Pela tela de início, sem loja. Android, iPhone e computador com o mesmo código.</span></div><div class=\"card \"><div class=\"ic\">⚑</div><b>Três idiomas</b><span>Português, inglês e espanhol — toda frase traduzida na mesma entrega.</span></div><div class=\"card \"><div class=\"ic\">⛨</div><b>Dado de quem é</b><span>Cada registro pertence a um manejador; documento nunca em pasta pública.</span></div></div>", "<div class=\"olho an\"><i></i>17 · A caminho</div><h2 class=\"an\">O que vem a seguir</h2><div class=\"duo an\"><div><ul class=\"tracos\"><li><div><b>Clima do passado</b> <span>— abate de dias atrás com o tempo daquele momento, e abate na fila offline.</span></div></li><li><div><b>Compartilhar rota e sala</b> <span>— com permissão de ver ou seguir.</span></div></li><li><div><b>Artigos</b> <span>— conteúdo técnico, com leitura e votação.</span></div></li><li><div><b>Gestão ampliada e Play Store</b> <span>— aprovação de lojas, campanhas, e o app na loja Android.</span></div></li></ul></div><div><svg class=\"il\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"384\" height=\"284\" rx=\"14\" fill=\"#201E17\" stroke=\"#3A362B\"/><path d=\"M40 250 Q120 250 150 190 T250 120 Q300 80 360 70\" fill=\"none\" stroke=\"#3A362B\" stroke-width=\"3\" stroke-dasharray=\"6 8\"/><g class=\"il-cai\" style=\"--d:0.0s\"><circle cx=\"40\" cy=\"250\" r=\"14\" fill=\"#5E8C4A\"/><path d=\"M34 250 l4 5 8-10\" fill=\"none\" stroke=\"#16150F\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"il-cai\" style=\"--d:0.22s\"><circle cx=\"150\" cy=\"190\" r=\"14\" fill=\"#5E8C4A\"/><path d=\"M144 190 l4 5 8-10\" fill=\"none\" stroke=\"#16150F\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"il-cai\" style=\"--d:0.44s\"><circle cx=\"250\" cy=\"120\" r=\"14\" fill=\"#201E17\" stroke=\"#D9A441\" stroke-width=\"3\" stroke-dasharray=\"4 4\"/></g><g class=\"il-cai\" style=\"--d:0.66s\"><circle cx=\"360\" cy=\"70\" r=\"14\" fill=\"#201E17\" stroke=\"#D9A441\" stroke-width=\"3\" stroke-dasharray=\"4 4\"/></g></svg></div></div>", "<div class=\"capa\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center\"><img data-logo alt=\"JavaStreak\" class=\"an\" style=\"width:clamp(180px,24vw,340px)\"><h2 class=\"an\" style=\"margin-top:2vh\">Do campo ao relatório,<br>num só aplicativo</h2><div class=\"fluxo an\" style=\"max-width:1000px\"><div class=\"passo\"><i>1</i><b>Preparar</b><span>Documentação, propriedade, cevas e rotas.</span></div><div class=\"passo\"><i>2</i><b>Caçar</b><span>Mapa ao vivo, com ou sem sinal.</span></div><div class=\"passo\"><i>3</i><b>Registrar</b><span>Eventos e abates com clima medido.</span></div><div class=\"passo\"><i>4</i><b>Prestar contas</b><span>Fechamento do IBAMA ao encerrar.</span></div></div><p class=\"sub an\" style=\"margin-top:4vh;font-size:clamp(13px,1.4vw,19px)\">javastreak.com</p></div>"];

const palco = document.getElementById('palco');
palco.innerHTML = SLIDES.map((s, i) => `<section class="slide" data-i="${i}">${s}</section>`).join('');
document.getElementById('marca').src = SIMB;
document.querySelectorAll('img[data-logo]').forEach((e) => { e.src = LOGO; });

const slides = [...document.querySelectorAll('.slide')];
const barra = document.querySelector('#barra i');
const conta = document.getElementById('conta');
let atual = 0;

function ir(n, tras = false) {
  n = Math.max(0, Math.min(slides.length - 1, n));
  if (n === atual) return;
  slides[atual].classList.remove('on');
  slides[atual].classList.toggle('saiu-tras', !tras);
  atual = n;
  slides[atual].classList.remove('saiu-tras');
  slides[atual].classList.add('on');
  pintar();
}
function pintar() {
  barra.style.width = ((atual + 1) / slides.length * 100) + '%';
  conta.textContent = String(atual + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
  location.hash = 's' + (atual + 1);
}

/* Teclado, toque e roda — três formas de andar, porque a apresentação pode
   rodar em telão, notebook ou celular. */
addEventListener('keydown', (e) => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); ir(atual + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); ir(atual - 1, true); }
  if (e.key === 'Home') ir(0, true);
  if (e.key === 'End') ir(slides.length - 1);
  if (e.key === 'f' || e.key === 'F') telaCheia();
});
document.getElementById('pro').onclick = () => ir(atual + 1);
document.getElementById('ant').onclick = () => ir(atual - 1, true);
document.getElementById('tela').onclick = telaCheia;

function telaCheia() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

let x0 = null;
addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 55) ir(atual + (d < 0 ? 1 : -1), d > 0);
  x0 = null;
}, { passive: true });

let trava = 0;
addEventListener('wheel', (e) => {
  const agora = Date.now();
  if (agora - trava < 700 || Math.abs(e.deltaY) < 22) return;
  trava = agora;
  ir(atual + (e.deltaY > 0 ? 1 : -1), e.deltaY < 0);
}, { passive: true });

/* Abrir direto num slide pelo endereço (#s7), útil para retomar a conversa. */
const alvo = parseInt((location.hash || '').replace('#s', ''), 10);
atual = isFinite(alvo) && alvo >= 1 && alvo <= slides.length ? alvo - 1 : 0;
slides[atual].classList.add('on');
pintar();
</script>
